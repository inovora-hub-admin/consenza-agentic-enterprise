server:
  port: 5445
  address: 0.0.0.0
  shutdown: graceful


#Database configuration for PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://consenza-postgres:5432/agentic
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres_secure_pass}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  base-url: https://api.openai.com/v1
  default-model: gpt-4.1-mini
