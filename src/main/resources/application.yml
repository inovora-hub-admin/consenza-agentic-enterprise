server:
  port: 5445
  address: 0.0.0.0
  shutdown: graceful

spring:
  datasource:
    url: jdbc:h2:mem:agentic;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  base-url: https://api.anthropic.com
  default-model: claude-sonnet-5-5
platform:
  ui-origin: https://portal.consenza.africa
